name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Test the engine
        run: cargo test --workspace --exclude olympium-linux
      - name: Test the Android refusal rule
        run: |
          javac -d /tmp/olympium-java \
            hosts/android/protocol/src/main/java/app/olympium/protocol/LaunchGate.java \
            hosts/android/protocol/src/test/java/app/olympium/protocol/LaunchGateTest.java
          java -cp /tmp/olympium-java app.olympium.protocol.LaunchGateTest
      - name: Test the OpenHarmony refusal rule
        run: node hosts/harmony/protocol/launch-gate.test.js
      - name: Check host icon sets
        run: python3 scripts/check-icons.py
      - name: Check the experimental deb and zip polyglot
        run: bash scripts/test-polyglot-deb-zip.sh

  macos-pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Test the Mac refusal kit
        run: swift test --package-path hosts/macos
      - name: Build the engine and an ad-hoc pkg
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: olympium-macos-pkg
          path: |
            dist/*.pkg
            dist/SIGNING.txt
            dist/update.json

  # The package job produces Olympium-<version>.pkg as a workflow artifact.
  # This job is the Mac download and boot check. It does not upload a package
  # and it does not publish a release. GitHub-hosted macOS runners are Apple
  # Silicon, so the client fetches the aarch64 slim Linux image.
  macos-guest:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install QEMU when the runner does not already have it
        run: |
          if ! command -v qemu-system-aarch64 >/dev/null 2>&1; then
            brew install qemu
          fi
          qemu-system-aarch64 --version
          echo "Lima is not used. This boots the slim Alpine guest with QEMU."
      - name: Download, check, and boot the slim Linux guest
        run: |
          cargo build -p olympium-cli --release
          export OLYMPIUM_HOME="$RUNNER_TEMP/olympium-home"
          ./target/release/olympium fetch --guest linux
          test -f "$OLYMPIUM_HOME/runtimes/linux/EDITION"
          test -f "$OLYMPIUM_HOME/runtimes/linux/boot/vmlinuz"
          ./target/release/olympium guest --guest linux
          set +e
          ./target/release/olympium fetch --guest windows
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "An aarch64 Mac must not accept the Linux x86_64 Wine archive as installed." >&2
            exit 1
          fi
          echo "Windows fetch on this Mac returned $code, as expected. The published Wine archive is a Linux x86_64 ELF."
