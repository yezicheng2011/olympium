name: Android 17 managed runtime

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/android-managed.yml'
      - 'image/olympium-android'
      - 'image/android*.py'
      - 'image/android-runtime-pins.json'
      - 'image/test-android*.py'
      - 'image/android-compat/**'
      - 'image/build-android-support.py'
      - 'validation/android/*.py'
      - 'validation/android/gms-probe/**'
      - 'validation/runtime-artifacts.json'

permissions:
  contents: read

concurrency:
  group: android-managed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-kvm-roundtrip:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require KVM
        run: |
          if [ ! -c /dev/kvm ]; then
            echo 'Hardware acceptance requires /dev/kvm on this runner.'
            exit 1
          fi
      - name: Prepare build tools and KVM access
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends acl adb aapt default-jdk-headless libsmali-java musl-tools python3-pil
          sudo usermod -aG kvm "$(id -un)"
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Runtime boundary checks
        run: |
          /usr/bin/python3 image/test-android-runtime.py
          /usr/bin/python3 image/test-android-framework.py
      - name: Build pinned support assets
        run: /usr/bin/python3 image/build-android-support.py --output build/android-support-assets
      - name: Verify installation, services, calculator and cold-boot recovery
        run: sudo -u "$(id -un)" -g kvm -- /usr/bin/python3 validation/android/managed-roundtrip.py --work "$RUNNER_TEMP/android-managed" --output build/android-managed-report
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-managed-report
          path: build/android-managed-report
          if-no-files-found: ignore
          retention-days: 14
