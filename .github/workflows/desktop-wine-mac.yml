name: Desktop Wine and Mac installer
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/desktop-wine-mac.yml'
      - 'desktop/**'
      - 'image/src/olympium-mac-run.cpp'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/desktop-wine-mac.yml'
      - 'desktop/**'
      - 'image/src/olympium-mac-run.cpp'
permissions:
  contents: read
concurrency:
  group: desktop-wine-mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [Wine GUI, Mac installer]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install desktop dependencies
        timeout-minutes: 6
        run: |
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get "${apt_options[@]}" install -y --no-install-recommends \
            libwlroots-dev libwayland-dev libpango1.0-dev libgtk-3-dev \
            libgdk-pixbuf-2.0-dev libxkbcommon-dev libdrm-dev libpixman-1-dev \
            libxcb-xfixes0-dev liblzma-dev zlib1g-dev xwayland grim p7zip-full cpio
          sudo install -d -o "$(id -un)" /run/dev-desktop
      - name: Install both Wine loaders from Ubuntu
        if: matrix.suite == 'Wine GUI'
        timeout-minutes: 7
        run: |
          sudo dpkg --add-architecture i386
          sources="$RUNNER_TEMP/wine-ubuntu.list"
          for suite in noble noble-updates noble-security; do
            printf 'deb [arch=amd64,i386] https://archive.ubuntu.com/ubuntu %s main universe\n' "$suite"
          done > "$sources"
          apt_options=(
            -o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o Acquire::Languages=none -o Acquire::Retries=2 -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l apt-get "${apt_options[@]}" install -y --no-install-recommends \
            wine wine64 wine32:i386 gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          test -x /usr/lib/wine/wine
      - name: Verify Wine GUI and 32-bit executable
        if: matrix.suite == 'Wine GUI'
        run: make -C desktop test-wine
      - name: Verify Mac package installer under Landlock
        if: matrix.suite == 'Mac installer'
        run: |
          make -C desktop dev-install
          test "$(desktop/dev-install confinement)" = landlock
          make -C desktop test-mac
