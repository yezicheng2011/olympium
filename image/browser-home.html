<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Firefox</title>
<style>
  html, body { margin: 0; background: #ffffff; color: #1d1d1f; }
  body {
    font-family: "Ubuntu", "Noto Sans", "Noto Sans CJK SC", "DejaVu Sans", sans-serif;
    padding: 36px 42px;
  }
  h1 { font-weight: 500; font-size: 34px; margin: 0 0 8px; }
  .label { color: #6e6e73; font-size: 13px; margin: 18px 0 2px; }
  p { margin: 0; font-size: 18px; }
  .sample { font-size: 20px; margin-top: 4px; }
  code {
    font-family: "Ubuntu Mono", "Noto Sans Mono", "DejaVu Sans Mono", monospace;
    font-size: 16px;
  }
</style>
</head>
<body>
  <h1>Firefox</h1>
  <p class="label">System font</p>
  <p>Ubuntu</p>
  <p class="label">Monospace</p>
  <p><code>Ubuntu Mono</code></p>
  <p class="label">Fallback for other scripts</p>
  <p>Noto Sans, then Noto Sans CJK, then DejaVu Sans</p>
  <p class="sample">Hello · Здравствуйте · مرحبا · สวัสดี · 你好</p>
</body>
</html>
