<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Ubuntu is the interface face. Noto and DejaVu supply scripts it does
       not cover. All three are freely redistributable. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Ubuntu Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono CJK SC</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>
  <match target="pattern">
    <test name="family"><string>Ubuntu</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Noto Sans Mono</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>
</fontconfig>
