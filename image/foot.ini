# Terminal defaults for the Olympium session.
# A light window with dark text, and a fixed title so the menu bar,
# the window, and the dock all say Terminal.

[main]
title=Terminal
locked-title=yes
font=DejaVu Sans Mono:size=11
pad=10x8

[colors]
background=ffffff
foreground=1d1d1f
selection-background=b3d4ff
selection-foreground=1d1d1f

[csd]
preferred=server
