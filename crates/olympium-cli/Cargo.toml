[package]
name = "olympium-cli"
description = "Command line for Olympium."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "olympium"
path = "src/main.rs"

[[bin]]
name = "linkspan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
olympium-core = { path = "../olympium-core" }
serde_json = "1.0"
